<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Top Ribbon Gradient -->
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="40%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
    
    <!-- Middle Loop Gradient -->
    <linearGradient id="gradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <!-- Bottom Loop Gradient -->
    <linearGradient id="gradBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="60%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#0A387E"/>
    </linearGradient>

    <!-- Bottom Left Bar Gradient -->
    <linearGradient id="gradBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#039BE5"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>

    <!-- Cyan Connection Nodes -->
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- 1. Top Sweeping Hook -->
    <path d="M 430 240 L 620 240 C 635 240 645 252 645 268 C 645 284 635 296 620 296 L 430 296 C 360 296 310 340 310 410 C 310 480 360 525 430 525 L 515 525 L 430 580 L 350 580 C 240 580 160 500 160 380 C 160 260 250 240 430 240 Z" 
          fill="url(#gradTop)"/>

    <!-- 2. Middle Diagonal Connection Blade -->
    <path d="M 470 420 L 610 420 C 655 420 685 450 685 495 C 685 530 660 560 625 570 L 515 580 L 415 515 C 385 485 420 420 470 420 Z" 
          fill="url(#gradMid)"/>

    <!-- 3. Bottom Sweeping Loop -->
    <path d="M 520 700 C 610 700 680 635 680 545 C 680 495 650 460 610 460 C 570 460 540 490 540 535 C 540 580 500 615 450 615 L 340 615 L 340 700 Z" 
          fill="url(#gradBot)"/>

    <!-- 4. Bottom Horizontal Pill Bar -->
    <path d="M 190 665 L 480 665 C 500 665 515 680 515 700 C 515 720 500 735 480 735 L 190 735 C 165 735 145 710 160 685 L 175 665 Z" 
          fill="url(#gradBar)"/>

    <!-- 5. Cyan Connection Node Upper Right -->
    <circle cx="645" cy="530" r="42" fill="url(#gradCyan)"/>

    <!-- 6. Cyan Connection Node Lower Center -->
    <circle cx="535" cy="695" r="28" fill="url(#gradCyan)"/>
  </g>
</svg>