<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#020617; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="dcFloorTiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="1.5" fill="#334155"/>
    </pattern>
    <linearGradient id="coldAisle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="hotAisle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f87171" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#dcFloorTiles)"/>

  <!-- Outer Security Perimeter Wall -->
  <rect x="30" y="30" width="1140" height="740" rx="14" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <rect x="34" y="34" width="1132" height="732" rx="10" fill="none" stroke="#0284c7" stroke-width="1.5"/>

  <!-- HEADER BADGE -->
  <g transform="translate(60, 55)">
    <rect width="420" height="40" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="26" fill="#38bdf8" font-size="16" font-weight="900" letter-spacing="1.5">🗄️ DATA CENTER &amp; NOC OPERATIONS CENTER</text>
  </g>

  <!-- ==================== LEFT AREA: SERVER ROOM / RACK ROWS ==================== -->
  <rect x="60" y="115" width="700" height="630" rx="10" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <text x="80" y="145" fill="#94a3b8" font-size="13" font-weight="bold">PHÒNG MÁY CHỦ CHÍNH (TIER 3 SERVER ROOM)</text>

  <!-- ROW A: RACK 01 - 04 (Cold Aisle Containment) -->
  <!-- Cold Aisle A -->
  <rect x="180" y="170" width="460" height="40" rx="4" fill="url(#coldAisle)" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="360" y="195" fill="#38bdf8" font-size="11" font-weight="bold">❄️ HÀNH LANG LẠNH (COLD AISLE 01)</text>

  <!-- Racks A1 - A4 -->
  <g transform="translate(180, 220)">
    <!-- Rack 1 -->
    <rect x="0" y="0" width="100" height="70" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="5" y="5" width="90" height="15" fill="#0284c7"/>
    <text x="18" y="17" fill="#fff" font-size="10" font-weight="bold">RACK-01 (CORE)</text>
    <text x="15" y="45" fill="#94a3b8" font-size="10">Core Switch &amp; FW</text>

    <!-- Rack 2 -->
    <rect x="120" y="0" width="100" height="70" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="125" y="5" width="90" height="15" fill="#0284c7"/>
    <text x="135" y="17" fill="#fff" font-size="10" font-weight="bold">RACK-02 (ESXi)</text>
    <text x="135" y="45" fill="#94a3b8" font-size="10">VMware Cluster</text>

    <!-- Rack 3 -->
    <rect x="240" y="0" width="100" height="70" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="245" y="5" width="90" height="15" fill="#0284c7"/>
    <text x="255" y="17" fill="#fff" font-size="10" font-weight="bold">RACK-03 (SAN)</text>
    <text x="255" y="45" fill="#94a3b8" font-size="10">Storage Array</text>

    <!-- Rack 4 -->
    <rect x="360" y="0" width="100" height="70" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="365" y="5" width="90" height="15" fill="#0284c7"/>
    <text x="375" y="17" fill="#fff" font-size="10" font-weight="bold">RACK-04 (DB)</text>
    <text x="375" y="45" fill="#94a3b8" font-size="10">ERP Database</text>
  </g>

  <!-- Hot Aisle A/B -->
  <rect x="180" y="300" width="460" height="35" rx="4" fill="url(#hotAisle)" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="360" y="322" fill="#f87171" font-size="11" font-weight="bold">🔥 HÀNH LANG NÓNG (HOT AISLE)</text>

  <!-- ROW B: RACK 05 - 08 -->
  <g transform="translate(180, 345)">
    <!-- Rack 5 -->
    <rect x="0" y="0" width="100" height="70" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="5" y="5" width="90" height="15" fill="#0284c7"/>
    <text x="15" y="17" fill="#fff" font-size="10" font-weight="bold">RACK-05 (BACKUP)</text>
    <text x="15" y="45" fill="#94a3b8" font-size="10">Tape &amp; Veeam</text>

    <!-- Rack 6 -->
    <rect x="120" y="0" width="100" height="70" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="125" y="5" width="90" height="15" fill="#0284c7"/>
    <text x="135" y="17" fill="#fff" font-size="10" font-weight="bold">RACK-06 (TELCO)</text>
    <text x="135" y="45" fill="#94a3b8" font-size="10">ISP Leased Line</text>

    <!-- Rack 7 -->
    <rect x="240" y="0" width="100" height="70" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="245" y="5" width="90" height="15" fill="#d97706"/>
    <text x="255" y="17" fill="#fff" font-size="10" font-weight="bold">RACK-07 (UPS 1)</text>
    <text x="255" y="45" fill="#fde68a" font-size="10">40kVA Online</text>

    <!-- Rack 8 -->
    <rect x="360" y="0" width="100" height="70" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="365" y="5" width="90" height="15" fill="#d97706"/>
    <text x="375" y="17" fill="#fff" font-size="10" font-weight="bold">RACK-08 (UPS 2)</text>
    <text x="375" y="45" fill="#fde68a" font-size="10">Battery Backup</text>
  </g>

  <!-- Cold Aisle B -->
  <rect x="180" y="425" width="460" height="40" rx="4" fill="url(#coldAisle)" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="360" y="450" fill="#38bdf8" font-size="11" font-weight="bold">❄️ HÀNH LANG LẠNH (COLD AISLE 02)</text>

  <!-- Precision Cooling Units (CRAC) -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="70" height="110" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <text x="12" y="50" fill="#38bdf8" font-size="11" font-weight="bold">ĐIỀU HÒA</text>
    <text x="10" y="70" fill="#e2e8f0" font-size="11" font-weight="bold">CHÍNH XÁC 1</text>

    <rect x="0" y="160" width="70" height="110" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <text x="12" y="210" fill="#38bdf8" font-size="11" font-weight="bold">ĐIỀU HÒA</text>
    <text x="10" y="230" fill="#e2e8f0" font-size="11" font-weight="bold">CHÍNH XÁC 2</text>
  </g>

  <!-- IT Staging Workbench Bottom Server Room -->
  <rect x="180" y="540" width="460" height="100" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="200" y="570" fill="#e2e8f0" font-size="13" font-weight="bold">BÀN KỸ THUẬT TEST MÁY &amp; SỬA CHỮA PHẦN CỨNG</text>
  <rect x="200" y="585" width="130" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="215" y="610" fill="#93c5fd" font-size="10">TRẠM TEST 01</text>
  <rect x="345" y="585" width="130" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="360" y="610" fill="#93c5fd" font-size="10">TRẠM TEST 02</text>
  <rect x="490" y="585" width="130" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="505" y="610" fill="#93c5fd" font-size="10">KHO PHỤ TÙNG</text>

  <!-- ==================== RIGHT AREA: NOC ROOM & SECURITY ==================== -->
  <rect x="780" y="115" width="390" height="630" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="800" y="145" fill="#38bdf8" font-size="14" font-weight="bold">📊 TRUNG TÂM VẬN HÀNH NOC 24/7</text>

  <!-- NOC Video Wall -->
  <rect x="820" y="170" width="310" height="18" rx="3" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <text x="880" y="184" fill="#022c22" font-size="11" font-weight="bold">MÀN HÌNH TƯỜNG VIDEO WALL NOC</text>

  <!-- Operator Console 1 & 2 -->
  <g transform="translate(820, 240)">
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="15" y="30" fill="#e2e8f0" font-size="11" font-weight="bold">TRẠM TRỰC NOC 1</text>
    <text x="15" y="50" fill="#94a3b8" font-size="10">Giám Sát Mạng Network</text>

    <rect x="170" y="0" width="140" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="185" y="30" fill="#e2e8f0" font-size="11" font-weight="bold">TRẠM TRỰC NOC 2</text>
    <text x="185" y="50" fill="#94a3b8" font-size="10">Giám Sát Server &amp; DB</text>
  </g>

  <!-- Operator Console 3 & Security SOC -->
  <g transform="translate(820, 360)">
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="15" y="30" fill="#fbcfe8" font-size="11" font-weight="bold">TRẠM SOC SEC 1</text>
    <text x="15" y="50" fill="#94a3b8" font-size="10">An Ninh &amp; SIEM Alert</text>

    <rect x="170" y="0" width="140" height="70" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="185" y="30" fill="#f3e8ff" font-size="11" font-weight="bold">TRẠM HELPDESK</text>
    <text x="185" y="50" fill="#94a3b8" font-size="10">Hotline &amp; Hỗ Trợ 24/7</text>
  </g>

  <!-- Biometric Airlock Door -->
  <rect x="820" y="500" width="310" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="840" y="530" fill="#fde68a" font-size="12" font-weight="bold">🔒 CỬA KHÓA BẢO MẬT &amp; VÂN TAY SINH TRẮC HỌC</text>
  <text x="840" y="555" fill="#cbd5e1" font-size="11">Cửa cách ly Airlock bảo vệ truy cập Server Room</text>

  <!-- Fire Suppression FM200 -->
  <rect x="820" y="610" width="310" height="60" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="840" y="635" fill="#fca5a5" font-size="11" font-weight="bold">🚨 HỆ THỐNG PCCC KHÍ SẠCH FM-200</text>
  <text x="840" y="655" fill="#f87171" font-size="10">Bình khí dập lửa tự động không dẫn điện</text>
</svg>
