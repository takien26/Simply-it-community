<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0f172a; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="branchGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#branchGrid)"/>
  <rect x="40" y="40" width="1120" height="720" rx="14" fill="none" stroke="#38bdf8" stroke-width="5"/>

  <text x="60" y="75" fill="#38bdf8" font-size="16" font-weight="900" letter-spacing="1">🏦 CHI NHÁNH GIAO DỊCH &amp; SHOWROOM BÁN LẺ (BRANCH OFFICE)</text>

  <!-- CUSTOMER FRONT ZONE -->
  <rect x="60" y="100" width="1080" height="240" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="2"/>
  <text x="80" y="130" fill="#38bdf8" font-size="14" font-weight="bold">QUẦY GIAO DỊCH VIÊN PHỤC VỤ KHÁCH HÀNG (TELLER DESKS)</text>

  <g transform="translate(80, 160)">
    <!-- Counter 1 -->
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="30" fill="#93c5fd" font-size="11" font-weight="bold">QUẦY SỐ 01</text>
    <text x="20" y="50" fill="#cbd5e1" font-size="10">POS + Máy Quét</text>

    <!-- Counter 2 -->
    <rect x="175" y="0" width="150" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="205" y="30" fill="#93c5fd" font-size="11" font-weight="bold">QUẦY SỐ 02</text>
    <text x="195" y="50" fill="#cbd5e1" font-size="10">POS + Máy In Kim</text>

    <!-- Counter 3 -->
    <rect x="350" y="0" width="150" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="380" y="30" fill="#93c5fd" font-size="11" font-weight="bold">QUẦY SỐ 03</text>
    <text x="370" y="50" fill="#cbd5e1" font-size="10">POS + Máy Đếm Tiền</text>

    <!-- Counter 4 -->
    <rect x="525" y="0" width="150" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="555" y="30" fill="#93c5fd" font-size="11" font-weight="bold">QUẦY SỐ 04</text>
    <text x="545" y="50" fill="#cbd5e1" font-size="10">Tư Vấn Khách Hàng</text>

    <!-- VIP Lounge Desk -->
    <rect x="700" y="0" width="180" height="70" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="730" y="30" fill="#fde68a" font-size="11" font-weight="bold">QUẦY KHÁCH VIP</text>
    <text x="720" y="50" fill="#fcd34d" font-size="10">PC Chuyên Dụng VIP</text>

    <!-- ATM / Kiosk Area -->
    <rect x="900" y="0" width="140" height="70" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="920" y="30" fill="#a7f3d0" font-size="11" font-weight="bold">KIOSK / ATM</text>
    <text x="915" y="50" fill="#6ee7b7" font-size="10">Máy Tra Cứu Tự Động</text>
  </g>

  <!-- BACK OFFICE WORKSPACE -->
  <rect x="60" y="360" width="700" height="380" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="2"/>
  <text x="80" y="390" fill="#38bdf8" font-size="14" font-weight="bold">KHỐI LÀM VIỆC NỘI BỘ (BACK-OFFICE &amp; KIỂM SOÁT)</text>

  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="180" height="65" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="35" fill="#93c5fd" font-size="11">BÀN XỬ LÝ HỒ SƠ 01</text>

    <rect x="210" y="0" width="180" height="65" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="235" y="35" fill="#93c5fd" font-size="11">BÀN XỬ LÝ HỒ SƠ 02</text>

    <rect x="420" y="0" width="230" height="65" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="440" y="35" fill="#fde68a" font-size="11">BÀN KIỂM SOÁT VIÊN CHÍNH</text>

    <rect x="0" y="85" width="180" height="65" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="120" fill="#93c5fd" font-size="11">BÀN HÀNH CHÍNH CHI NHÁNH</text>

    <rect x="210" y="85" width="180" height="65" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="240" y="120" fill="#93c5fd" font-size="11">BÀN IT CHI NHÁNH</text>

    <rect x="420" y="85" width="230" height="65" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="445" y="120" fill="#fda4af" font-size="11">MÁY IN CHỨNG TỪ &amp; SCAN TỐC ĐỘ CAO</text>

    <!-- Branch Network Rack -->
    <rect x="0" y="180" width="650" height="90" rx="6" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5"/>
    <text x="20" y="215" fill="#38bdf8" font-size="12" font-weight="bold">TỦ MẠNG CHI NHÁNH (BRANCH NETWORK RACK &amp; ROUTER VPN SD-WAN)</text>
    <text x="20" y="240" fill="#94a3b8" font-size="11">Kết nối VPN mã hóa trực tiếp về Trụ sở chính (HQ Core)</text>
  </g>

  <!-- BRANCH MANAGER ROOM -->
  <rect x="780" y="360" width="360" height="180" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="390" fill="#fde68a" font-size="13" font-weight="bold">👔 PHÒNG GIÁM ĐỐC CHI NHÁNH</text>
  <rect x="820" y="420" width="160" height="70" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="835" y="460" fill="#fde68a" font-size="11">BÀN GIÁM ĐỐC CN</text>

  <!-- VAULT & SECURITY CASH ROOM -->
  <rect x="780" y="560" width="360" height="180" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="800" y="590" fill="#fca5a5" font-size="13" font-weight="bold">🔒 PHÒNG KÉT SẮT &amp; CAMERA AN NINH</text>
  <text x="800" y="620" fill="#f87171" font-size="11">Hệ thống đầu ghi CCTV NVR &amp; Cảnh báo hồng ngoại</text>
</svg>
